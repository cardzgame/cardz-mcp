name: Release npm Packages

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: node scripts/check-sanitization.mjs
      - name: Publish @cardz/schemas, @cardz/mcp-core, @cardz/mcp-server
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          npm publish -w @cardz/schemas --provenance --access public
          npm publish -w @cardz/mcp-core --provenance --access public
          npm publish -w @cardz/mcp-server --provenance --access public
