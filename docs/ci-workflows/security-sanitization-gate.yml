name: Security & Sanitization Gate

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Gitleaks secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  sanitization-and-license-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Run 5-layer sanitization, OPSEC, binary & license gate
        env:
          PRIVATE_DENYLIST_REGEX_B64: ${{ secrets.PRIVATE_DENYLIST_REGEX_B64 }}
        run: node scripts/check-sanitization.mjs
