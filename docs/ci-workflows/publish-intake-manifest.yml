name: Publish Read-Only Intake Manifest

on:
  push:
    branches: [main]
    paths:
      - "registry/**"

permissions:
  contents: read

jobs:
  build-readonly-manifest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm run validate
      - run: npm run build:manifest
      - uses: actions/upload-artifact@v4
        with:
          name: readonly-intake-manifest
          path: dist/intake-manifest.json
          retention-days: 30
